name: Update satellites

# 하루 1회 CelesTrak GP 데이터를 받아 public/data/satellites.json을
# 갱신한다 (spec §7). 이 파일의 커밋이 배포를 트리거한다.
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch CelesTrak data
        run: node scripts/fetch-satellites.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/satellites.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: 위성 데이터 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
