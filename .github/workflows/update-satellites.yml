name: Update satellites

# 하루 1회 CelesTrak GP 데이터를 받아 public/data/satellites.json을
# 갱신한다 (spec §7). 이 workflow가 끝나면 deploy.yml이 최신 release를
# 새 위성 데이터로 다시 배포한다. 위성 데이터는 main에만 반영하고
# develop에는 병합하지 않는다(배포는 항상 main의 위성 데이터를 쓴다).
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 수동 실행 시 선택한 브랜치와 관계없이 항상 main을 갱신한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # fetch-satellites.mjs가 satellite.js로 궤도를 계산하므로 의존성이 필요하다.
      - run: npm ci

      - name: Fetch CelesTrak data
        run: node scripts/fetch-satellites.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/satellites.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: 위성 데이터 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
